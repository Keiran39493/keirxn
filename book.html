<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a Session · Keiran Moores</title>
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="description" content="Request IT, AI or security support from Keiran Moores.">
  <link rel="stylesheet" href="assets/style.css?v=20">
</head>
<body>
  <div class="page">
    <aside class="sidebar"></aside>
    <main class="content">
      <h1>Book a Session</h1>
      <p class="lead">Tell me what you need and when suits you. I'll get back to you by email to confirm the date and time.</p>

      <form class="review-form" id="book-form" data-formspree="xeaalyka" novalidate>
        <input type="hidden" name="_subject" value="New support booking request">
        <input type="hidden" name="form_type" value="support-booking">

        <h2 class="form-section">Your details</h2>
        <div class="form-row two">
          <label>Your name <span class="req">*</span>
            <input type="text" name="name" required autocomplete="name">
          </label>
          <label>Company <span class="opt">(optional)</span>
            <input type="text" name="company" autocomplete="organization">
          </label>
        </div>
        <div class="form-row two">
          <label>Email <span class="req">*</span>
            <input type="email" name="email" required autocomplete="email">
          </label>
          <label>Phone <span class="opt">(optional)</span>
            <input type="tel" name="phone" autocomplete="tel">
          </label>
        </div>

        <h2 class="form-section">What you need</h2>
        <label>Service needed <span class="req">*</span>
          <select name="service" required>
            <option value="" disabled selected>Select a service…</option>
            <option value="On-site and remote IT services">On-site and remote IT services</option>
            <option value="AI adoption strategy">AI adoption strategy</option>
            <option value="Security auditing &amp; compliance (SOC 2, ISO 27001)">Security auditing &amp; compliance (SOC 2, ISO 27001)</option>
            <option value="Products / software support">Products / software support</option>
            <option value="Consultation / recommendation" data-key="consultation">Consultation / recommendation</option>
            <option value="Other">Other</option>
          </select>
        </label>
        <div class="form-row two">
          <label>Support type <span class="req">*</span>
            <select name="support_type" required>
              <option value="Remote">Remote</option>
              <option value="On-site">On-site</option>
              <option value="Not sure">Not sure</option>
            </select>
          </label>
          <label>Urgency <span class="req">*</span>
            <select name="urgency" required>
              <option value="Normal">Normal</option>
              <option value="Soon (within a few days)">Soon (within a few days)</option>
              <option value="Urgent (business is affected)">Urgent (business is affected)</option>
            </select>
          </label>
        </div>
        <label>Describe the issue or project <span class="req">*</span>
          <textarea name="details" rows="5" required minlength="10" placeholder="What's happening, what have you tried, how many people or devices are affected?"></textarea>
        </label>

        <h2 class="form-section">When</h2>
        <div class="form-row two">
          <div class="field date-field">
            <span class="field-label" id="date-label">Preferred date <span class="req">*</span></span>
            <button type="button" class="date-input" id="date-input" aria-haspopup="dialog" aria-expanded="false" aria-labelledby="date-label date-input">
              <span class="date-text">Select a date</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            </button>
            <div class="picker" id="picker" role="dialog" aria-label="Choose a date" hidden>
              <div class="picker-head">
                <button type="button" class="picker-nav" data-step="-1" aria-label="Previous month">‹</button>
                <span class="picker-month" aria-live="polite"></span>
                <button type="button" class="picker-nav" data-step="1" aria-label="Next month">›</button>
              </div>
              <div class="picker-grid"></div>
            </div>
            <input type="hidden" name="preferred_date">
          </div>
          <label>Preferred time
            <select name="preferred_time">
              <option value="Any time">Any time</option>
              <option value="Morning">Morning</option>
              <option value="Afternoon">Afternoon</option>
              <option value="Evening">Evening</option>
            </select>
          </label>
        </div>
        <label id="address-field" hidden>On-site address <span class="req">*</span>
          <input type="text" name="address" autocomplete="street-address">
        </label>

        <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

        <p class="form-msg" role="status" aria-live="polite"></p>
        <button type="submit" class="btn-solid">Send request</button>
      </form>

      <div class="callout thanks" id="thanks" data-i18n="book.thanks" hidden>
        <strong>Thanks, your request has been sent!</strong> I'll get back to you by email to confirm a date and time.
      </div>
    </main>
  </div>
  <script src="assets/i18n.js?v=21"></script>
  <script src="assets/layout.js?v=22"></script>
  <script src="assets/globe.js?v=3"></script>
  <script>
    (function () {
      const t = window.I18N ? I18N.t : (s) => s;
      const locale = window.I18N ? I18N.locale : "en-GB";
      const form = document.getElementById("book-form");
      const msg = form.querySelector(".form-msg");
      const btn = form.querySelector("button[type=submit]");
      const date = form.elements.preferred_date;
      const type = form.elements.support_type;
      const addrField = document.getElementById("address-field");
      const addr = form.elements.address;

      // Preselect a service from the link, e.g. book.html?service=consultation
      const want = new URLSearchParams(location.search).get("service");
      const opt = [...form.elements.service.options].find((o) => want && o.dataset.key === want);
      if (opt) opt.selected = true;

      // ---- Date picker ----
      const picker = document.getElementById("picker");
      const grid = picker.querySelector(".picker-grid");
      const monthLabel = picker.querySelector(".picker-month");
      const trigger = document.getElementById("date-input");
      const dateText = trigger.querySelector(".date-text");
      const openPicker = () => { picker.hidden = false; trigger.setAttribute("aria-expanded", "true"); render();
        (grid.querySelector(".picker-day.selected") || grid.querySelector(".picker-day:not([disabled])") || picker.querySelector(".picker-nav:not([disabled])"))?.focus(); };
      const closePicker = (refocus) => { picker.hidden = true; trigger.setAttribute("aria-expanded", "false"); if (refocus) trigger.focus(); };
      trigger.addEventListener("click", () => (picker.hidden ? openPicker() : closePicker()));
      document.addEventListener("click", (e) => { if (!picker.hidden && !e.target.closest(".date-field")) closePicker(); });
      picker.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.preventDefault(); closePicker(true); } });
      const MONTHS_AHEAD = 6;
      const pad = (n) => String(n).padStart(2, "0");
      const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const firstMonth = new Date(today.getFullYear(), today.getMonth(), 1);
      const lastMonth = new Date(today.getFullYear(), today.getMonth() + MONTHS_AHEAD, 1);
      let view = new Date(firstMonth);
      // If nothing is pickable this month (e.g. last day of month), start on next month
      if (new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate() === today.getDate()) view.setMonth(view.getMonth() + 1);

      function render() {
        monthLabel.textContent = view.toLocaleDateString(locale, { month: "long", year: "numeric" });
        picker.querySelector('[data-step="-1"]').disabled = view <= firstMonth;
        picker.querySelector('[data-step="1"]').disabled = view >= lastMonth;
        let html = [...Array(7)].map((_, i) => `<span class="picker-dow">${new Date(2024, 0, 1 + i).toLocaleDateString(locale, { weekday: "short" }).replace(".", "").slice(0, 2)}</span>`).join("");
        html += "<span></span>".repeat((new Date(view.getFullYear(), view.getMonth(), 1).getDay() + 6) % 7);
        const days = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
        for (let i = 1; i <= days; i++) {
          const d = new Date(view.getFullYear(), view.getMonth(), i);
          const k = ymd(d), past = d <= today, sel = k === date.value;
          const name = d.toLocaleDateString(locale, { weekday: "long", day: "numeric", month: "long" });
          html += `<button type="button" class="picker-day${sel ? " selected" : ""}${k === ymd(today) ? " today" : ""}"
            data-date="${k}" aria-pressed="${sel}" aria-label="${name}" ${past ? "disabled" : ""}>${i}</button>`;
        }
        grid.innerHTML = html;
      }

      picker.addEventListener("click", (e) => {
        const nav = e.target.closest(".picker-nav");
        if (nav) { view.setMonth(view.getMonth() + Number(nav.dataset.step)); render(); return; }
        const day = e.target.closest(".picker-day:not([disabled])");
        if (!day) return;
        date.value = day.dataset.date;
        dateText.textContent = new Date(day.dataset.date + "T00:00:00")
          .toLocaleDateString(locale, { weekday: "short", day: "numeric", month: "long", year: "numeric" });
        trigger.classList.add("has-date");
        trigger.classList.remove("invalid");
        closePicker(true);
      });
      render();

      // Ask for an address only for on-site visits
      type.addEventListener("change", () => {
        const onsite = type.value === "On-site";
        addrField.hidden = !onsite;
        addr.required = onsite;
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!form.checkValidity()) {
          msg.textContent = t("Please fill in the required fields (marked *).");
          msg.className = "form-msg err";
          form.reportValidity();
          return;
        }
        if (!date.value) {
          msg.textContent = t("Please select a preferred date.");
          msg.className = "form-msg err";
          trigger.classList.add("invalid");
          trigger.scrollIntoView({ behavior: "smooth", block: "center" });
          trigger.focus();
          return;
        }
        btn.disabled = true; btn.textContent = t("Sending…"); msg.textContent = "";
        try {
          const res = await fetch("https://formspree.io/f/" + form.dataset.formspree, {
            method: "POST", body: new FormData(form), headers: { Accept: "application/json" },
          });
          if (!res.ok) throw new Error(res.status);
          form.hidden = true;
          document.getElementById("thanks").hidden = false;
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (err) {
          msg.textContent = t("Sorry, that didn't send. Please try again or email me directly.");
          msg.className = "form-msg err";
          btn.disabled = false; btn.textContent = t("Send request");
        }
      });
    })();
  </script>
</body>
</html>
